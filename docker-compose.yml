services:
  db:
    image: mysql:9.1.0
    command: mysql --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: rest_with_spring_boot_erudio
    ports:
      - 3308:3306
    expose:
      - 3306
    networks:
      - erudio-network
  rest-spring-boot-erudio:
    image: leandrocgsi/rest-spring-boot-erudio:latest
    restart: always
    build: ./rest-spring-boot-erudio
    working_dir: /rest-spring-boot-erudio
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/rest_with_spring_boot_erudio?useTimezone=true&serverTimezone=UTC
      SPRING.USERNAME: root
      SPRING.PASSWORD: root
    command: mvn spring-boot:run
    ports:
      - 80:80
    depends_on:
      - db
    networks:
      - erudio-network
networks:
  erudio-network:
    driver: bridge