name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"


jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: maven

    - name: Build Application .jar
      working-directory: ./
      env:
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: mvn clean package

    - name: Docker Compose Build
      working-directory: ./
      run: docker compose build

    - name: Push to Docker Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-spring-boot-erudio:latest ${{ secrets.DOCKER_USERNAME }}/rest-spring-boot-erudio:ghjid 
        
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-spring-boot-erudio:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-spring-boot-erudio:${{ github.run_id }}

